<!DOCTYPE html>
<html>
  <head>
    <title>Pong exercise</title>
  </head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <body>
    <canvas id="gameCanvas" width="340" height="500" style="border:2px solid black"></canvas>
    <button id="upBtn">Up</button>
    <button id="downBtn">Down</button>

    <button id="restartBtn">Restart</button>

    <script>
      let canvas=document.getElementById("gameCanvas");
      let ctx=canvas.getContext("2d");

      let playerScore=0;
      let aiScore=0;
      
      let paddleWidth=10;
      let paddleHeight=50;
      let paddleY=110;

      let paddle2Y=110;
      let paddle2X=canvas.width-20;

      let ballX=canvas.width/2;
      let ballY=canvas.height/2;
      let ballRadius=10;
      let ballDX=3;
      let ballDY=3;

      let upPressed=false;
      let upBtn=document.getElementById("upBtn");
      let gameRunning=false;
      upBtn.addEventListener("touchstart",function(e){
        e.preventDefault();
        upPressed=true;
      });
      upBtn.addEventListener("touchend",function(e){
        e.preventDefault();
        upPressed=false;
      });

      let downPressed=false;
      let downBtn=document.getElementById("downBtn");
      downBtn.addEventListener("touchstart",function(e){
        e.preventDefault();
        downPressed=true;});
        downBtn.addEventListener("touchend",function(e){
          e.preventDefault();
          downPressed=false;
        });
      document.addEventListener("keydown", function(e) {
        if (e.key === "ArrowUp" || e.key === "w" || e.key === "W") {
          upPressed = true;
        }
        if (e.key === "ArrowDown" || e.key === "s" || e.key === "S") {
          downPressed = true;
        }
      });
    document.addEventListener("keyup", function(e) {
      if (e.key === "ArrowUp" || e.key === "w" || e.key === "W") {
        upPressed = false;
      }
      if (e.key === "ArrowDown" || e.key === "s" || e.key === "S") {
        downPressed = false;
      }
    });
    let lastTime = 0;
    function gameLoop(currentTime)
    {
      let deltaTime = (currentTime - lastTime) / 1000;
      lastTime = currentTime;
        if (aiScore >= 5) {
          gameRunning=false;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#1a1a2e";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "white";
    ctx.font = "30px Times New Roman";
    ctx.fillText("Game Over", canvas.width / 2 - 80, canvas.height / 2);
    return;
        }
        
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle = "#1a1a2e";
ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle="white";
        ctx.setLineDash([10,10]);
        ctx.beginPath();
        ctx.moveTo(canvas.width/2,0);
        ctx.lineTo(canvas.width/2,canvas.height);
        ctx.stroke();

        if (ballY+ballRadius>canvas.height || ballY-ballRadius<0)
      {
       ballDY=-ballDY; 
        
      }
        if(ballX-ballRadius < 10+paddleWidth && ballY > paddleY && ballY < paddleY+paddleHeight)
        {
          ballDX=-ballDX;
          ballX = 10 + paddleWidth + ballRadius;
        }
        if(ballX+ballRadius > paddle2X && ballY > paddle2Y && ballY < paddle2Y+paddleHeight){
          ballDX=-ballDX;
          ballX = paddle2X - ballRadius;
        }
      if (paddle2Y+paddleHeight/2>ballY)
      {
          paddle2Y-=2.5;
       }
        if (paddle2Y+paddleHeight/2<ballY)
        {
          paddle2Y+=2.5;
        }
      if (ballX-ballRadius<0)
      {
        aiScore+=1;
        ballX=canvas.width/2;
        ballY=canvas.height/2;
      }
        if (ballX+ballRadius>canvas.width)
        {
          playerScore+=1;
          ballX=canvas.width/2;
          ballY=canvas.height/2;
        }
        if(upPressed && paddleY>0){
          paddleY-=300 * deltaTime;
        }
        if(downPressed && paddleY+paddleHeight<canvas.height){
          paddleY+=300 * deltaTime;
        }
        ballX +=ballDX * 60 * deltaTime;
        ballY +=ballDY * 60 * deltaTime;
        ctx.fillStyle="white"
        ctx.fillRect(10,paddleY,paddleWidth,paddleHeight);
        ctx.fillRect(paddle2X,paddle2Y,paddleWidth,paddleHeight);

        ctx.beginPath();
        ctx.arc(ballX,ballY,ballRadius,0,Math.PI*2);
        ctx.fillStyle="#ff7b00";
        ctx.fill();

        ctx.fillStyle="white";
        ctx.font="25px Arial";
        ctx.fillText(playerScore,canvas.width/4,30);
        ctx.fillText(aiScore,canvas.width/4*3,30);
        requestAnimationFrame(gameLoop);
      }
      function startGame(){
        if (!gameRunning){
          gameRunning=true;
          requestAnimationFrame (gameLoop);
        }
      }
      function restartGame() {
        playerScore = 0;
        aiScore = 0;
        ballX = canvas.width / 2;
        ballY = canvas.height / 2;
        ballDX = 3;
        ballDY = 3;
        paddleY = 110;
        paddle2Y = 110;
  startGame();
      }
      startGame();
document.getElementById("restartBtn").addEventListener("click", restartGame);
    </script>
    <style>
      @media (hover : hover) and (pointer : fine) {
        #upBtn,#downBtn{
          display : none;
        }
      }
      #upBtn,#downBtn{
        width: 150px;
        height: 80px;
        font-size: 20px;
        margin: 10px;
        -webkit-user-select:none;
        user-select:none;
        -webkit-touch-callout:none;
        touch-action:none;
      }
      #restartBtn{
      width: 100px;
        height: 50px;
        font-size: 20px;
        margin: 10px;
        -webkit-user-select:none;
        user-select:none;
        -webkit-touch-callout:none;
        touch-action:none;
      }
      canvas {
        width: 90vw;
        max-width: 400px;
        height: auto;
        display: block;
        margin: 0 auto;
      }
      @media (hover: hover) and (pointer: fine) {
        canvas {
          max-width: 600px;
          max-height: 85vh;
        }
      }
    </style>
  </body>
</html
